[project]
name = "django-rest-framework-api-poc"
version = "1.0.0"
description = "Prova de conceito (POC) de uso de API com Django Rest Framework, MongoDB e Swagger"
requires-python = ">=3.10"
dependencies = [
    "Django>=3.2,<4.0",
    "djangorestframework>=3.14,<4.0",
    "drf-yasg>=1.21",
    "djongo>=1.3",
    "python-dotenv>=1.0",
    "pymongo==3.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "coverage>=7.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["movies", "theaters", "sessions"]

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
]
