version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB_NAME=cinema_db
    depends_on:
      - mongodb
    volumes:
      - .:/app

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
